[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seqcontrol"
version = "0.1.0.dev0"
description = "Control experiments for genomic language models: how much of a variant-effect score comes from the sequence versus its context."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aryan Sinha" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
seqcontrol = "seqcontrol.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["seqcontrol"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
